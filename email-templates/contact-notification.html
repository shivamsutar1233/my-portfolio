<div style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #1a1a1a; background: #ffffff;">
  <h2 style="margin: 0 0 4px; font-size: 20px;">New message from your portfolio</h2>
  <p style="margin: 0 0 20px; font-size: 13px; color: #666;">
    Sent via the contact form on shivamsutar.dev
  </p>

  <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
    <tr>
      <td style="padding: 8px 0; font-weight: bold; width: 90px; vertical-align: top; font-size: 14px;">From</td>
      <td style="padding: 8px 0; font-size: 14px;">{{from_name}}</td>
    </tr>
    <tr>
      <td style="padding: 8px 0; font-weight: bold; vertical-align: top; font-size: 14px;">Email</td>
      <td style="padding: 8px 0; font-size: 14px;">
        <a href="mailto:{{reply_to}}" style="color: #0e7490; text-decoration: none;">{{reply_to}}</a>
      </td>
    </tr>
  </table>

  <div style="background: #f5f5f5; border-left: 3px solid #0e7490; padding: 14px 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: #333;">{{message}}</div>

  <p style="font-size: 12px; color: #999; margin-top: 24px;">
    Reply directly to this email to respond to {{from_name}} — Reply-To is already set to their address.
  </p>
</div>
